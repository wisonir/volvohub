<script>
  // ==========================================
  // APPLICATION STATE
  // ==========================================
  let CARS_DATA = [];
  let LEADS_DATA = [];
  let ACTIVE_VISUALIZER_CAR = null;
  let ADMIN_TOKEN = null;
  let DEFAULT_WHATSAPP = '6281234567890';
  // Payload file (base64 data URL) yang menunggu diunggah ke Google Drive
  let PENDING_CAR_PHOTO = '';
  let PENDING_BROCHURE = '';
  // Katalog lengkap (semua status) khusus panel Super Admin
  let ADMIN_CARS_DATA = [];

  // Inisialisasi awal saat DOM siap
  document.addEventListener('DOMContentLoaded', function () {
    if (window.lucide) {
      lucide.createIcons();
    }
    loadPublicCars();
    loadSiteConfig();

    // Preferensi tampilan pemilih unit pada Studio Visualizer.
    try {
      VIS_PICKER_COLLAPSED = localStorage.getItem('VOLVO_VIS_PICKER_COLLAPSED') === '1';
    } catch (e) { /* localStorage tidak tersedia */ }

    // Sesi admin tersimpan diverifikasi ke backend sebelum tombol admin ditampilkan.
    const savedToken = sessionStorage.getItem('VOLVO_ADMIN_TOKEN');
    if (savedToken) {
      verifyStoredAdminSession(savedToken);
    } else {
      setAdminEntryVisible(false);
    }
  });

  // ==========================================
  // DATA FETCHING & RENDERING (SHOWROOM)
  // ==========================================
  function loadPublicCars() {
    google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success) {
          CARS_DATA = response.data || [];
          renderCarsGrid(CARS_DATA);
          setupBookingUnitSelector(CARS_DATA);
          if (response.config && response.config.salesWhatsApp) {
            DEFAULT_WHATSAPP = response.config.salesWhatsApp;
            updateWhatsAppLinks(DEFAULT_WHATSAPP);
          }
        } else {
          showToast('Gagal memuat katalog unit mobil.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        showToast('Koneksi terputus: ' + err.message, 'error');
      })
      .getCarsData();
  }

  function updateWhatsAppLinks(num) {
    const dockBtn = document.getElementById('btn-mobile-dock-wa');
    if (dockBtn) {
      dockBtn.href = 'https://wa.me/' + num;
    }
  }

  function renderCarsGrid(cars) {
    const grid = document.getElementById('cars-grid');
    if (!grid) return;
    grid.innerHTML = '';

    if (!cars || cars.length === 0) {
      grid.innerHTML = '<div class="col-span-3 text-center py-12 text-slate-400 text-sm">Tidak ada kendaraan yang sesuai filter.</div>';
      return;
    }

    cars.forEach(function (car) {
      const isElectric = car.category === 'Pure Electric';
      const badgeStyle = isElectric
        ? 'bg-blue-50 text-brand-primary border-blue-200'
        : 'bg-slate-100 text-slate-700 border-slate-200';

      const card = document.createElement('div');
      card.className = 'bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between group';

      card.innerHTML = [
        '<div class="space-y-3">',
        '  <div class="flex items-center justify-between text-xs font-semibold">',
        '    <span class="px-2.5 py-0.5 rounded-full border ' + badgeStyle + '">' + car.category + '</span>',
        '    <span class="text-slate-400 font-mono text-[11px]">MY2025</span>',
        '  </div>',
        '  <div class="py-2 flex justify-center items-center h-44 overflow-hidden">',
        '    ' + buildImgTag_(car.mainImageUrl, car.model, 'h-36 w-full object-contain group-hover:scale-105 transition-transform duration-300 drop-shadow-md'),
        '  </div>',
        '  <div>',
        '    <h3 class="font-display font-bold text-xl text-brand-on-surface">' + car.model + '</h3>',
        '    <p class="text-xs text-slate-500">' + car.trim + '</p>',
        '  </div>',
        '  <div class="grid grid-cols-3 gap-2 py-2 text-center text-xs">',
        '    <div class="bg-slate-50 p-2 rounded-lg">',
        '      <span class="text-slate-400 block text-[10px]">0-100 km/h</span>',
        '      <span class="font-mono font-semibold text-brand-on-surface">' + (car.acceleration || '4.8s') + '</span>',
        '    </div>',
        '    <div class="bg-slate-50 p-2 rounded-lg">',
        '      <span class="text-slate-400 block text-[10px]">Jarak/Daya</span>',
        '      <span class="font-mono font-semibold text-brand-on-surface">' + (car.rangeOrPower || '476 km') + '</span>',
        '    </div>',
        '    <div class="bg-slate-50 p-2 rounded-lg">',
        '      <span class="text-slate-400 block text-[10px]">Baterai</span>',
        '      <span class="font-mono font-semibold text-brand-on-surface">' + (car.batteryCapacity ? car.batteryCapacity.split(' ')[0] : '69') + ' kWh</span>',
        '    </div>',
        '  </div>',
        '</div>',
        '<div class="pt-4 border-t border-slate-100 mt-2 space-y-3">',
        '  <div class="flex items-baseline justify-between">',
        '    <span class="text-xs text-slate-400">Harga OTR Jakarta</span>',
        '    <span class="font-mono font-bold text-base text-brand-primary-container">' + car.priceOtr + '</span>',
        '  </div>',
        '  <div class="grid grid-cols-5 gap-2">',
        '    <button type="button" onclick="openVisualizerById(\'' + car.id + '\')" class="col-span-4 h-10 bg-white hover:bg-slate-50 border border-brand-primary text-brand-primary text-xs font-semibold rounded-lg flex items-center justify-center space-x-1.5 transition-colors">',
        '      <i data-lucide="eye" class="w-3.5 h-3.5"></i>',
        '      <span>Buka Studio Visualizer</span>',
        '    </button>',
        '    <button type="button" onclick="contactSalesForCar(\'' + car.model + '\')" class="col-span-1 h-10 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 flex items-center justify-center transition-colors" title="Chat WhatsApp Sales">',
        '      <i data-lucide="message-square" class="w-4 h-4"></i>',
        '    </button>',
        '  </div>',
        '</div>'
      ].join('');

      grid.appendChild(card);
    });

    setTimeout(function () {
      if (window.lucide) lucide.createIcons();
    }, 50);
  }

  function filterCars(category) {
    document.querySelectorAll('.filter-tab').forEach(function (btn) {
      btn.className = 'filter-tab px-4 py-2 rounded-md text-xs font-semibold transition-all text-slate-500 hover:text-brand-on-surface';
    });

    if (category === 'all') {
      const btnAll = document.getElementById('filter-all');
      if (btnAll) btnAll.className = 'filter-tab px-4 py-2 rounded-md text-xs font-semibold transition-all bg-white text-brand-on-surface shadow-sm';
      renderCarsGrid(CARS_DATA);
    } else {
      if (category === 'Pure Electric') {
        const btnElec = document.getElementById('filter-electric');
        if (btnElec) btnElec.className = 'filter-tab px-4 py-2 rounded-md text-xs font-semibold transition-all bg-white text-brand-on-surface shadow-sm';
      } else {
        const btnHyb = document.getElementById('filter-hybrid');
        if (btnHyb) btnHyb.className = 'filter-tab px-4 py-2 rounded-md text-xs font-semibold transition-all bg-white text-brand-on-surface shadow-sm';
      }
      const filtered = CARS_DATA.filter(function (c) {return c.category === category;});
      renderCarsGrid(filtered);
    }
  }

  // ==========================================
  // STUDIO VISUALIZER LOGIC
  // ==========================================
  // Membuka Studio Visualizer untuk satu unit (mulai dari tab Eksterior).
  function openVisualizerById(carId) {
    selectVisualizerCar(carId, true);
  }

  // Menampilkan satu unit pada Studio Visualizer tanpa menutup modal.
  // resetTab = false dipakai pemilih unit agar tab yang sedang aktif tidak berpindah.
  function selectVisualizerCar(carId, resetTab) {
    let car = CARS_DATA.find(function (c) {return c.id === carId;});
    if (!car && CARS_DATA.length > 0) {
      car = CARS_DATA[0];
    }
    if (!car) return;
    ACTIVE_VISUALIZER_CAR = car;

    const elTitle = document.getElementById('vis-model-title');
    const elPrice = document.getElementById('vis-price-display');
    const elBattery = document.getElementById('vis-spec-battery');
    const elCharge = document.getElementById('vis-spec-charging');

    if (elTitle) elTitle.textContent = car.model;
    if (elPrice) elPrice.textContent = car.priceOtr;
    if (elBattery) elBattery.textContent = car.batteryCapacity || '69 kWh';
    if (elCharge) elCharge.textContent = car.chargingSpeed || '26 mnt';

    const carImg = document.getElementById('vis-car-image');
    if (carImg) setImgSrc_(carImg, car.mainImageUrl);

    // Render Swatches
    const swatchContainer = document.getElementById('vis-color-swatches');
    if (swatchContainer) {
      swatchContainer.innerHTML = '';
      let colors = [];
      try {
        colors = typeof car.exteriorColorsJson === 'string' ? JSON.parse(car.exteriorColorsJson) : car.exteriorColorsJson;
      } catch (e) {
        colors = [{name: 'Cloud Blue Metallic', hex: '#A9BAC6', imgUrl: car.mainImageUrl}];
      }

      if (colors && colors.length > 0) {
        const colorLabel = document.getElementById('vis-selected-color-name');
        if (colorLabel) colorLabel.textContent = colors[0].name;

        colors.forEach(function (col, idx) {
          const btn = document.createElement('button');
          btn.className = 'color-swatch-btn w-8 h-8 rounded-full border-2 border-white shadow-sm ' + (idx === 0 ? 'active-swatch' : '');
          btn.style.backgroundColor = col.hex;
          btn.title = col.name;
          btn.onclick = function () {
            document.querySelectorAll('.color-swatch-btn').forEach(function (b) {b.classList.remove('active-swatch');});
            btn.classList.add('active-swatch');
            if (colorLabel) colorLabel.textContent = col.name;

            if (carImg && col.imgUrl) {
              carImg.style.opacity = '0.3';
              setTimeout(function () {
                setImgSrc_(carImg, col.imgUrl);
                carImg.style.opacity = '1';
              }, 150);
            }
          };
          swatchContainer.appendChild(btn);
        });
      }
    }

    // Render Interior
    const interiorContainer = document.getElementById('vis-interior-gallery');
    if (interiorContainer) {
      interiorContainer.innerHTML = '';
      let interiors = [];
      try {
        interiors = typeof car.interiorImagesJson === 'string' ? JSON.parse(car.interiorImagesJson) : car.interiorImagesJson;
      } catch (e) {interiors = [];}

      if (interiors && interiors.length > 0) {
        interiors.forEach(function (item) {
          interiorContainer.innerHTML += [
            '<div class="rounded-xl border border-slate-200 overflow-hidden bg-white shadow-sm">',
            '  ' + buildImgTag_(item.imgUrl, item.title, 'w-full h-36 object-cover'),
            '  <div class="p-3">',
            '    <span class="font-bold text-xs text-brand-on-surface block">' + item.title + '</span>',
            '    <p class="text-[11px] text-slate-500 mt-0.5">' + (item.desc || '') + '</p>',
            '  </div>',
            '</div>'
          ].join('');
        });
      }
    }

    // Render Features
    const featuresContainer = document.getElementById('vis-features-list');
    if (featuresContainer) {
      featuresContainer.innerHTML = '';
      let features = [];
      try {
        features = typeof car.keyFeaturesJson === 'string' ? JSON.parse(car.keyFeaturesJson) : car.keyFeaturesJson;
      } catch (e) {features = [];}

      if (features && features.length > 0) {
        features.forEach(function (f) {
          featuresContainer.innerHTML += [
            '<div class="p-3.5 rounded-lg border border-slate-200 bg-white space-y-1">',
            '  <span class="font-bold text-xs text-brand-on-surface flex items-center space-x-1.5">',
            '    <i data-lucide="check-circle-2" class="w-4 h-4 text-brand-primary"></i>',
            '    <span>' + f.title + '</span>',
            '  </span>',
            '  <p class="text-[11px] text-slate-500 leading-relaxed pl-5">' + f.desc + '</p>',
            '</div>'
          ].join('');
        });
      }
    }

    // Video & Brochure
    const videoFrame = document.getElementById('vis-video-frame');
    if (videoFrame) videoFrame.src = car.videoUrl || 'https://www.youtube.com/embed/dQw4w9WgXcQ';

    const brochureLink = document.getElementById('vis-brochure-link');
    if (brochureLink) brochureLink.href = car.brochurePdfUrl || '#';

    renderVisualizerCarPicker();
    if (resetTab !== false) switchVisualizerTab('exterior');
    const modal = document.getElementById('visualizer-modal');
    if (modal) modal.classList.remove('hidden');

    if (window.lucide) lucide.createIcons();
  }

  function closeVisualizerModal() {
    const modal = document.getElementById('visualizer-modal');
    if (modal) modal.classList.add('hidden');
    const videoFrame = document.getElementById('vis-video-frame');
    if (videoFrame) videoFrame.src = '';
  }

  // Deretan unit pada Studio Visualizer agar pengunjung bisa langsung pindah mobil.
  function renderVisualizerCarPicker() {
    const wrap = document.getElementById('vis-car-picker-wrap');
    const picker = document.getElementById('vis-car-picker');
    if (!wrap || !picker) return;

    const cars = CARS_DATA || [];
    if (cars.length <= 1) {
      wrap.classList.add('hidden');
      picker.innerHTML = '';
      return;
    }
    wrap.classList.remove('hidden');

    const activeId = ACTIVE_VISUALIZER_CAR ? String(ACTIVE_VISUALIZER_CAR.id) : '';

    picker.innerHTML = cars.map(function (car) {
      const isActive = String(car.id) === activeId;
      const chipCls = isActive
        ? 'border-brand-primary bg-blue-50/60 ring-1 ring-brand-primary/30'
        : 'border-slate-200 bg-white hover:bg-slate-50';

      return '<button type="button" onclick="selectVisualizerCar(\'' + escapeHtml(car.id) + '\', false)"' +
        ' class="vis-car-chip shrink-0 w-28 p-2 rounded-xl border ' + chipCls + ' transition-all text-center">' +
        '<span class="flex items-center justify-center h-12 overflow-hidden">' +
        buildImgTag_(car.mainImageUrl, car.model, 'h-11 w-full object-contain') +
        '</span>' +
        '<span class="block text-[11px] font-bold text-brand-on-surface truncate mt-1">' + escapeHtml(car.model) + '</span>' +
        '<span class="block text-[9px] text-slate-400 font-mono truncate">' + escapeHtml(car.trim || '') + '</span>' +
        '</button>';
    }).join('');

    const count = document.getElementById('vis-car-count');
    if (count) count.textContent = cars.length + ' unit tersedia';

    applyVisPickerCollapsedState(cars.length);
    if (window.lucide) lucide.createIcons();
  }

  // Menerapkan status ringkas (collapse) atau lebar (expand) pada pemilih unit.
  function applyVisPickerCollapsedState(totalCars) {
    const picker = document.getElementById('vis-car-picker');
    const summary = document.getElementById('vis-picker-summary');
    const chevron = document.getElementById('vis-picker-chevron');
    const toggle = document.getElementById('vis-picker-toggle');

    if (picker) picker.classList.toggle('hidden', VIS_PICKER_COLLAPSED);

    // Saat ringkas, nama unit aktif tetap terlihat agar tidak membingungkan.
    if (summary) {
      const name = ACTIVE_VISUALIZER_CAR ? ACTIVE_VISUALIZER_CAR.model : '';
      const text = (VIS_PICKER_COLLAPSED && name) ? name + ' • ' + (totalCars || 0) + ' unit' : '';
      summary.textContent = text;
      summary.classList.toggle('hidden', !text);
    }

    // chevron-up diputar 180 derajat supaya mengarah ke bawah saat ringkas.
    if (chevron) {
      chevron.setAttribute('class',
        'w-4 h-4 text-slate-400 transition-transform duration-200' + (VIS_PICKER_COLLAPSED ? ' rotate-180' : ''));
    }

    if (toggle) toggle.setAttribute('aria-expanded', VIS_PICKER_COLLAPSED ? 'false' : 'true');
  }

  function switchVisualizerTab(tab) {
    const tabs = ['exterior', 'interior', 'features', 'video'];
    tabs.forEach(function (t) {
      const panel = document.getElementById('vis-tab-' + t);
      const btn = document.getElementById('tab-btn-' + t);
      if (panel) panel.classList.add('hidden');
      if (btn) btn.className = 'py-3 border-b-2 border-transparent text-slate-500 hover:text-brand-on-surface';
    });
    const targetPanel = document.getElementById('vis-tab-' + tab);
    const targetBtn = document.getElementById('tab-btn-' + tab);
    if (targetPanel) targetPanel.classList.remove('hidden');
    if (targetBtn) targetBtn.className = 'py-3 border-b-2 border-brand-primary text-brand-primary flex items-center space-x-1.5 font-semibold';
  }

  function bookCurrentVisualizerUnit() {
    closeVisualizerModal();
    if (ACTIVE_VISUALIZER_CAR) {
      openBookingModal(ACTIVE_VISUALIZER_CAR.model);
    } else {
      openBookingModal();
    }
  }

  // Tombol hero "Tonton Video Sinematik": arahkan ke bagian video landing page.
  function playCinematicVideo() {
    const section = document.getElementById('cinematic-video');
    const enabled = String((SITE_CONFIG && SITE_CONFIG.video_enabled) || 'true') !== 'false';
    const configured = enabled && !!resolveVideoSource_(SITE_CONFIG || {});

    if (configured && section && !section.classList.contains('hidden')) {
      section.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    if (CARS_DATA && CARS_DATA.length > 0) {
      openVisualizerById(CARS_DATA[0].id);
      switchVisualizerTab('video');
    } else {
      showToast('Katalog mobil sedang dimuat...', 'error');
    }
  }

  function contactSalesForCar(modelName) {
    const text = encodeURIComponent('Halo Volvo Batam & Jakarta, saya tertarik dengan informasi unit ' + modelName);
    window.open('https://wa.me/' + DEFAULT_WHATSAPP + '?text=' + text, '_blank');
  }

  // ==========================================
  // BOOKING TEST DRIVE LOGIC
  // ==========================================
  function setupBookingUnitSelector(cars) {
    const container = document.getElementById('booking-unit-selector');
    if (!container) return;
    container.innerHTML = '';

    cars.slice(0, 3).forEach(function (c, idx) {
      container.innerHTML += [
        '<label class="flex flex-col items-center p-2 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition-all text-center has-[:checked]:border-brand-primary has-[:checked]:bg-blue-50/50">',
        '  <input type="radio" name="selectedModel" value="' + c.model + '" ' + (idx === 0 ? 'checked' : '') + ' class="hidden peer">',
        '  ' + buildImgTag_(c.mainImageUrl, c.model, 'h-10 w-full object-contain mb-1'),
        '  <span class="text-[11px] font-bold text-brand-on-surface block peer-checked:text-brand-primary">' + c.model + '</span>',
        '  <span class="text-[9px] text-slate-400 font-mono">' + c.trim.split(' ')[0] + '</span>',
        '</label>'
      ].join('');
    });
  }

  function updateFormatToggle(radio) {
    const labelFlagship = document.getElementById('label-format-flagship');
    const labelHome = document.getElementById('label-format-home');
    if (!labelFlagship || !labelHome) return;

    if (radio.value === 'Showroom Flagship') {
      labelFlagship.className = 'flex items-center justify-center space-x-2 py-2 px-3 rounded-md cursor-pointer transition-all bg-white shadow-sm text-brand-primary font-semibold text-xs';
      labelHome.className = 'flex items-center justify-center space-x-2 py-2 px-3 rounded-md cursor-pointer transition-all text-slate-600 hover:text-brand-on-surface font-medium text-xs';
    } else {
      labelHome.className = 'flex items-center justify-center space-x-2 py-2 px-3 rounded-md cursor-pointer transition-all bg-white shadow-sm text-brand-primary font-semibold text-xs';
      labelFlagship.className = 'flex items-center justify-center space-x-2 py-2 px-3 rounded-md cursor-pointer transition-all text-slate-600 hover:text-brand-on-surface font-medium text-xs';
    }
  }

  function openBookingModal(preselectedModel) {
    const modal = document.getElementById('booking-modal');
    if (!modal) return;
    modal.classList.remove('hidden');

    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dateInput = document.getElementById('lead-date');
    if (dateInput) {
      dateInput.value = tomorrow.toISOString().split('T')[0];
    }

    if (preselectedModel) {
      const radios = document.getElementsByName('selectedModel');
      radios.forEach(function (r) {
        if (r.value === preselectedModel) r.checked = true;
      });
    }
  }

  function closeBookingModal() {
    const modal = document.getElementById('booking-modal');
    if (modal) modal.classList.add('hidden');
  }

  function handleLeadSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-lead');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span>Memproses Pengajuan...</span>';
    }

    const selectedModelRadio = document.querySelector('input[name="selectedModel"]:checked');
    const formatDeliveryRadio = document.querySelector('input[name="formatDelivery"]:checked');

    const payload = {
      fullName: (document.getElementById('lead-name') ? document.getElementById('lead-name').value.trim() : ''),
      whatsApp: (document.getElementById('lead-wa') ? document.getElementById('lead-wa').value.trim() : ''),
      modelInterest: selectedModelRadio ? selectedModelRadio.value : 'Volvo EX30',
      formatDelivery: formatDeliveryRadio ? formatDeliveryRadio.value : 'Showroom Flagship',
      cityShowroom: (document.getElementById('lead-city') ? document.getElementById('lead-city').value : ''),
      preferredDate: (document.getElementById('lead-date') ? document.getElementById('lead-date').value : ''),
      preferredSlot: (document.getElementById('lead-slot') ? document.getElementById('lead-slot').value : ''),
      notes: (document.getElementById('lead-notes') ? document.getElementById('lead-notes').value.trim() : '')
    };

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span>Konfirmasi Pengajuan Jadwal ➔</span>';
        }
        if (res && res.success) {
          closeBookingModal();
          const form = document.getElementById('lead-form');
          if (form) form.reset();
          showToast('Permintaan Test Drive terkonfirmasi! Concierge kami akan segera menghubungi Anda.', 'success');
        } else {
          showToast((res && res.message) ? res.message : 'Gagal menyimpan pengajuan.', 'error');
        }
      })
      .withFailureHandler(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span>Konfirmasi Pengajuan Jadwal ➔</span>';
        }
        showToast('Terjadi kesalahan: ' + err.message, 'error');
      })
      .submitLead(payload);
  }

  // ==========================================
  // ADMIN EXECUTIVE CRM & AUTH
  // ==========================================
  function openAdminModal() {
    if (ADMIN_TOKEN) {
      switchToAdminView();
    } else {
      const modal = document.getElementById('admin-login-modal');
      if (modal) modal.classList.remove('hidden');
    }
  }

  function closeAdminLoginModal() {
    const modal = document.getElementById('admin-login-modal');
    if (modal) modal.classList.add('hidden');
  }

  function handleAdminLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-admin-login');
    const pwdInput = document.getElementById('admin-password');
    const pwd = pwdInput ? pwdInput.value : '';

    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Verifikasi & Masuk';
        }
        if (res && res.success) {
          ADMIN_TOKEN = res.token;
          sessionStorage.setItem('VOLVO_ADMIN_TOKEN', ADMIN_TOKEN);
          setAdminEntryVisible(true);
          closeAdminLoginModal();
          switchToAdminView();
        } else {
          showToast('Kata sandi salah!', 'error');
        }
      })
      .withFailureHandler(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Verifikasi & Masuk';
        }
        showToast('Error login: ' + err.message, 'error');
      })
      .verifyAdmin(pwd);
  }

  function switchToAdminView() {
    const pub = document.getElementById('public-view');
    const adm = document.getElementById('admin-view');

    const car = carId
      ? ADMIN_CARS_DATA.filter(function (c) { return String(c.id) === String(carId); })[0]
      : null;

    if (car) {
      setFieldValue('drawer-car-id', car.id);
      setFieldValue('drawer-model', car.model);
      setFieldValue('drawer-trim', car.trim);
      setFieldValue('drawer-category', car.category || 'Pure Electric');
      setFieldValue('drawer-status', car.status || 'Active');
      setFieldValue('drawer-price', car.priceOtr);
      setFieldValue('drawer-acc', car.acceleration);
      setFieldValue('drawer-battery', car.batteryCapacity);
      setFieldValue('drawer-charging', car.chargingSpeed);
      setFieldValue('drawer-img', car.mainImageUrl);
      setFieldValue('drawer-video', car.videoUrl);
      setFieldValue('drawer-brochure', car.brochurePdfUrl);

      // "range • power" dipisah kembali agar kolom terisi terpisah.
      const parts = String(car.rangeOrPower || '').split('•');
      setFieldValue('drawer-range', parts[0] ? parts[0].trim() : '');
      setFieldValue('drawer-power', parts[1] ? parts[1].trim() : '');

  function handleSaveCar(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-save-car');

    const modelVal = getFieldValue('drawer-model');
    const imgUrl = getFieldValue('drawer-img');
    const brochureUrl = getFieldValue('drawer-brochure');
    const rangeVal = getFieldValue('drawer-range');
    const powerVal = getFieldValue('drawer-power');

    if (!modelVal) {
      showToast('Nama model wajib diisi.', 'error');
      return;
    }
    if (!PENDING_CAR_PHOTO && !imgUrl) {
      showToast('Foto utama unit wajib diunggah atau isi URL foto.', 'error');
      return;
    }

    // Jaga total payload agar tidak melewati batas google.script.run (±50 MB).
    const pendingBytes = estimatePendingBytes_();
    if (pendingBytes > MAX_SAVE_PAYLOAD_BYTES) {
      showToast('Total gambar terlalu besar (' + (pendingBytes / (1024 * 1024)).toFixed(1) +
        ' MB). Maksimal 20 MB per penyimpanan - kurangi jumlah gambar.', 'error');
      return;
    }

    const unitId = getFieldValue('drawer-car-id') || ('VOLVO-' + Date.now());

    function setBusy(busy, label) {
      if (!btn) return;
      btn.disabled = busy;
      btn.textContent = busy ? (label || 'Menyimpan...') : 'Simpan Perubahan';
    }

    function setStatus(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function resetPending() {
      PENDING_CAR_PHOTO = '';
      PENDING_BROCHURE = '';
    }

    function saveUnit(photoValue, brochureValue) {
      setBusy(true, 'Menyimpan...');

      const carPayload = {
        id: unitId,
        model: modelVal,
        trim: getFieldValue('drawer-trim'),
        category: getFieldValue('drawer-category') || 'Pure Electric',
        priceOtr: getFieldValue('drawer-price'),
        acceleration: getFieldValue('drawer-acc'),
        batteryCapacity: getFieldValue('drawer-battery') || '69 kWh',
        chargingSpeed: getFieldValue('drawer-charging'),
        rangeOrPower: rangeVal ? (powerVal ? rangeVal + ' • ' + powerVal : rangeVal) : powerVal,
        mainImageUrl: photoValue,
        videoUrl: getFieldValue('drawer-video'),
        exteriorColorsJson: collectColorRows(),
        interiorImagesJson: collectInteriorRows(),
        keyFeaturesJson: collectFeatureRows(),
        brochurePdfUrl: brochureValue,
        status: getFieldValue('drawer-status') || 'Active'
      };

      google.script.run
        .withSuccessHandler(function (res) {
          setBusy(false);
          if (res && res.success) {
            resetPending();
            closeCarDrawer();
            showToast(res.message || 'Data unit kendaraan berhasil diperbarui!', 'success');
            loadPublicCars();
            loadAdminCars();
          } else {
            showToast((res && res.message) ? res.message : 'Gagal menyimpan unit.', 'error');
          }
        })
        .withFailureHandler(function (err) {
          setBusy(false);
          showToast('Error: ' + err.message, 'error');
        })
        .saveCarUnit(ADMIN_TOKEN, carPayload);
    }

    // Langkah 2: unggah brosur PDF (opsional) lalu simpan unit.
    function uploadBrochure(photoValue) {
      if (!PENDING_BROCHURE) {
        saveUnit(photoValue, brochureUrl);
        return;
      }
      setBusy(true, 'Mengunggah PDF...');
      setStatus('drawer-brochure-status', 'Mengunggah PDF ke Drive...');
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            setStatus('drawer-brochure-status', 'Tersimpan di ' + (res.folder || 'Drive'));
            saveUnit(photoValue, res.url);
          } else {
            setBusy(false);
            setStatus('drawer-brochure-status', 'Gagal mengunggah PDF');
            showToast('Gagal mengunggah PDF: ' + ((res && res.message) || 'tidak diketahui'), 'error');
          }
        })
        .withFailureHandler(function (err) {
          setBusy(false);
          setStatus('drawer-brochure-status', 'Gagal mengunggah PDF');
          showToast('Gagal mengunggah PDF: ' + err.message, 'error');
        })
        .uploadBrochurePdf(ADMIN_TOKEN, PENDING_BROCHURE, unitId + '_brochure.pdf');
    }

    // Langkah 1: unggah foto utama ke Drive (bila admin memilih file baru).
    if (PENDING_CAR_PHOTO) {
      setBusy(true, 'Mengunggah foto...');
      setStatus('drawer-img-status', 'Mengunggah foto ke Drive...');
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            setStatus('drawer-img-status', 'Tersimpan di ' + (res.folder || 'Drive'));
            if (res.shared === 'private') {
              showToast('Foto terunggah, tetapi tautan Drive belum publik. Set "Anyone with the link" pada berkas di Drive agar foto tampil di showroom.', 'error');
            }
            uploadBrochure(res.url);
          } else {
            setBusy(false);
            setStatus('drawer-img-status', 'Gagal mengunggah foto');
            showToast('Gagal mengunggah foto: ' + ((res && res.message) || 'tidak diketahui'), 'error');
          }
        })
        .withFailureHandler(function (err) {
          setBusy(false);
          setStatus('drawer-img-status', 'Gagal mengunggah foto');
          showToast('Gagal mengunggah foto: ' + err.message, 'error');
        })
        .uploadCarPhoto(ADMIN_TOKEN, PENDING_CAR_PHOTO, unitId + '_main.jpg', 'image/jpeg');
    } else {
      uploadBrochure(imgUrl);
    }
  }

  function showToast(message, type) {
    const toast = document.getElementById('toast-notification');
    const msg = document.getElementById('toast-message');
    const icon = document.getElementById('toast-icon');
    if (!toast || !msg || !icon) return;

    msg.textContent = message;
    if (type === 'error') {
      icon.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-rose-400"></i>';
    } else {
      icon.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>';
    }
    if (window.lucide) lucide.createIcons();

    toast.classList.remove('hidden');
    setTimeout(function () {toast.classList.remove('translate-y-2');}, 10);
    setTimeout(function () {
      toast.classList.add('translate-y-2');
      setTimeout(function () {toast.classList.add('hidden');}, 300);
    }, 4000);
  }
  // ==========================================
  // UTILITY: ESCAPE & FIELD HELPERS
  // ==========================================
  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ==========================================
  // UTILITY: GAMBAR (RANTAI FALLBACK)
  // Foto Drive disimpan pada host CDN lh3.googleusercontent.com. Bila gagal
  // (mis. tautan Drive belum dibagikan), gambar dicoba ulang lewat endpoint
  // thumbnail Drive, lalu ditutup placeholder agar tampilan tidak rusak.
  // ==========================================
  const IMG_PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500">' +
    '<rect width="800" height="500" fill="#e2e8f0"/>' +
    '<text x="400" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#94a3b8">Foto belum tersedia</text>' +
    '</svg>'
  );

  const DRIVE_ID_PATTERN = /[-\w]{25,}/;

  // Mengambil ID berkas Drive dari berbagai bentuk URL (lh3, file/d/, uc?id=).
  function extractDriveId_(url) {
    const s = String(url || '');
    const byParam = s.match(/[?&]id=([-\w]{25,})/);
    if (byParam) return byParam[1];
    const byPath = s.match(/\/d\/([-\w]{25,})/);
    if (byPath) return byPath[1];
    const any = s.match(DRIVE_ID_PATTERN);
    return any ? any[0] : '';
  }

  // Google memblokir "uc?export=view" saat dipakai di <img>, sehingga unit lama
  // yang tersimpan dengan URL gaya itu ikut tidak tampil. Normalkan ke host CDN lh3.
  function normalizeImageUrl_(url) {
    const src = String(url || '');
    if (!src || src.indexOf('data:') === 0) return src;
    if (src.indexOf('googleusercontent.com') >= 0) return src;
    if (src.indexOf('drive.google.com') < 0) return src;
    const id = extractDriveId_(src);
    return id ? ('https://lh3.googleusercontent.com/d/' + id + '=w1600') : src;
  }

  function driveThumbUrl_(url) {
    const s = String(url || '');
    // Hanya URL Drive yang punya fallback; data URL / host lain tidak perlu.
    if (!s || s.indexOf('data:') === 0) return '';
    if (s.indexOf('drive.google.com') < 0 && s.indexOf('googleusercontent.com') < 0) return '';
    const id = extractDriveId_(s);
    return id ? ('https://drive.google.com/thumbnail?id=' + id + '&sz=w1600') : '';
  }

  // Handler onerror berantai untuk tag <img>.
  function imgFallback(el) {
    if (!el) return;
    const next = el.getAttribute ? el.getAttribute('data-fallback') : '';
    if (next) {
      el.removeAttribute('data-fallback');
      el.src = next;
      return;
    }
    el.onerror = null;
    el.src = IMG_PLACEHOLDER;
  }

  // Menyusun tag <img> lengkap dengan rantai fallback.
  function buildImgTag_(url, alt, cls) {
    const src = normalizeImageUrl_(url);
    const thumb = driveThumbUrl_(src);
    return '<img src="' + escapeHtml(src || IMG_PLACEHOLDER) + '"' +
      ' alt="' + escapeHtml(alt || '') + '"' +
      ' class="' + cls + '"' +
      (thumb ? ' data-fallback="' + escapeHtml(thumb) + '"' : '') +
      ' onerror="imgFallback(this)">';
  }

  // Menetapkan src pada elemen <img> yang sudah ada, sekaligus menyiapkan fallback.
  function setImgSrc_(el, url) {
    if (!el) return;
    const src = normalizeImageUrl_(url);
    const thumb = driveThumbUrl_(src);
    if (thumb) el.setAttribute('data-fallback', thumb);
    else el.removeAttribute('data-fallback');
    el.onerror = function () { imgFallback(el); };
    el.src = src || IMG_PLACEHOLDER;
  }

  function getFieldValue(id) {
    const el = document.getElementById(id);

  }

  function setFieldValue(id, value) {

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          container.innerHTML = '<p class="text-rose-500">Gagal memuat Drive: ' +
            escapeHtml((res && res.message) || 'tidak diketahui') + '</p>';
          return;
        }

        const rows = (res.folders || []).map(function (f) {
          return [
            '<div class="flex items-center justify-between p-3 rounded-lg border border-slate-200 bg-slate-50">',
            '  <div class="flex items-center space-x-2 min-w-0">',

            '  </div>',
            '  <div class="flex items-center space-x-3 shrink-0">',

            '    <a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener" class="text-[11px] font-semibold text-brand-primary hover:underline">Buka</a>',
            '  </div>',

          '    <span class="font-bold text-brand-on-surface">' + escapeHtml(res.rootName) + '</span>',

  // ==========================================
  // DRIVE FILE UPLOAD (FOTO & BROSUR)
  // ==========================================
  function readFileAsDataUrl(file, onDone, onError) {
    const reader = new FileReader();
    reader.onload = function (e) { onDone(e.target.result); };
    reader.onerror = function () { onError(); };
    reader.readAsDataURL(file);
  }

  function handleCarPhotoSelected(input) {
    const file = input && input.files ? input.files[0] : null;
    if (!file) return;

    const status = document.getElementById('drawer-img-status');
    const preview = document.getElementById('drawer-img-preview');

    if (file.size > 5 * 1024 * 1024) {
      showToast('Ukuran foto maksimal 5 MB.', 'error');
      input.value = '';
      return;
    }

    if (status) status.textContent = 'Membaca ' + file.name + '...';

    readFileAsDataUrl(file, function (dataUrl) {
      PENDING_CAR_PHOTO = dataUrl;
      if (status) status.textContent = file.name + ' siap diunggah ke Drive';
      if (preview) {
        preview.src = dataUrl;
        preview.classList.remove('hidden');
      }
    }, function () {
      if (status) status.textContent = 'Gagal membaca file';
      showToast('Gagal membaca file foto.', 'error');
    });
  }

  function handleBrochureSelected(input) {
    const file = input && input.files ? input.files[0] : null;
    if (!file) return;

    const status = document.getElementById('drawer-brochure-status');

    if (file.size > 10 * 1024 * 1024) {
      showToast('Ukuran PDF maksimal 10 MB.', 'error');
      input.value = '';
      return;
    }

    if (status) status.textContent = 'Membaca ' + file.name + '...';

    readFileAsDataUrl(file, function (dataUrl) {
      PENDING_BROCHURE = dataUrl;
      if (status) status.textContent = file.name + ' siap diunggah ke Drive';
    }, function () {
      if (status) status.textContent = 'Gagal membaca file';
      showToast('Gagal membaca file PDF.', 'error');
    });
  }

  // ==========================================
  // DYNAMIC REPEATERS (WARNA, INTERIOR, FITUR)
  // Semua baris dibangun dinamis agar Super Admin bisa mengatur
  // seluruh atribut unit tanpa menyentuh kode.
  // ==========================================
  const HEX_PATTERN = /^#[0-9a-fA-F]{6}$/;

  function normalizeHex_(value) {
    const v = String(value == null ? '' : value).trim();
    return HEX_PATTERN.test(v) ? v.toLowerCase() : '#a9bac6';
  }

  function parseJsonSafe_(value) {
    if (Array.isArray(value)) return value;
    if (typeof value === 'string' && value.trim()) {
      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }
    return [];
  }

  function clearRepeater(listId) {
    const list = document.getElementById(listId);
    if (list) list.innerHTML = '';
  }

  function rowInput(row, cls) {
    const el = row.querySelector('.' + cls);
    return el ? String(el.value || '').trim() : '';
  }

  function removeRepeaterRow(row) {
    if (row && row.parentNode) row.parentNode.removeChild(row);
  }

  // Batas ukuran gambar per baris repeater (payload google.script.run ±50 MB).
  const REPEATER_IMG_MAX_BYTES = 3 * 1024 * 1024;
  // Batas total gambar yang dikirim dalam satu penyimpanan unit.
  const MAX_SAVE_PAYLOAD_BYTES = 20 * 1024 * 1024;

  // Menemukan baris repeater dari elemen mana pun di dalamnya.
  function findRepeaterRow_(el) {
    let node = el ? el.parentNode : null;
    while (node) {
      if (node.className && String(node.className).split(/\s+/).indexOf('repeater-row') >= 0) return node;
      node = node.parentNode;
    }
    return null;
  }

  // Menampilkan (atau menyembunyikan) thumbnail pratinjau pada satu baris repeater.
  function setRepeaterPreview_(row, value) {
    if (!row) return;
    const preview = row.querySelector('.rep-preview');
    if (!preview) return;
    const v = String(value || '');
    if (v) {
      // Pakai rantai fallback agar URL Drive lama pun tetap tampil.
      setImgSrc_(preview, v);
      preview.classList.remove('hidden');
    } else {
      preview.removeAttribute('src');
      preview.removeAttribute('data-fallback');
      preview.onerror = null;
      preview.classList.add('hidden');
    }
  }

  // Nilai gambar satu baris: hasil unggah (base64) diutamakan atas URL manual.
  function rowImageValue_(row) {
    if (row && row._pendingImg) return row._pendingImg;
    return rowInput(row, 'rep-img');
  }

  // Perkiraan total byte gambar yang belum diunggah (foto utama, brosur, repeater).
  function estimatePendingBytes_() {
    let total = PENDING_CAR_PHOTO ? PENDING_CAR_PHOTO.length : 0;
    total += PENDING_BROCHURE ? PENDING_BROCHURE.length : 0;

    ['drawer-colors-list', 'drawer-interiors-list'].forEach(function (id) {
      const list = document.getElementById(id);
      if (!list) return;
      Array.prototype.slice.call(list.querySelectorAll('.repeater-row')).forEach(function (row) {
        if (row._pendingImg) total += row._pendingImg.length;
      });
    });

    return total;
  }

  // Admin memilih berkas gambar pada baris warna/interior → dibaca sebagai data URL.
  function handleRepeaterImageSelected(input) {
    const file = input && input.files ? input.files[0] : null;
    if (!file) return;

    if (file.size > REPEATER_IMG_MAX_BYTES) {
      showToast('Ukuran gambar maksimal 3 MB per baris.', 'error');
      input.value = '';
      return;
    }

    readFileAsDataUrl(file, function (dataUrl) {
      const row = findRepeaterRow_(input);
      if (!row) return;
      row._pendingImg = dataUrl;

      const urlInput = row.querySelector('.rep-img');
      if (urlInput) {
        urlInput.value = '';
        urlInput.placeholder = 'Akan diunggah: ' + file.name;
      }
      setRepeaterPreview_(row, dataUrl);
      showToast('Gambar ' + file.name + ' siap diunggah bersama unit ini.', 'success');
    }, function () {
      showToast('Gagal membaca file gambar.', 'error');
    });
  }

  // Menyambungkan tombol hapus, tombol unggah, dan pratinjau pada satu baris.
  function wireRepeaterRow(row) {
    const delBtn = row.querySelector('.rep-del');
    if (delBtn) {
      delBtn.onclick = function () { removeRepeaterRow(row); };
    }

    const uploadBtn = row.querySelector('.rep-upload');
    const fileInput = row.querySelector('.rep-file');
    if (uploadBtn && fileInput) {
      uploadBtn.onclick = function () {
        if (typeof fileInput.click === 'function') fileInput.click();
      };
      fileInput.onchange = function () { handleRepeaterImageSelected(fileInput); };
    }

    const urlInput = row.querySelector('.rep-img');
    if (urlInput) {
      setRepeaterPreview_(row, urlInput.value);
      urlInput.oninput = function () { setRepeaterPreview_(row, urlInput.value); };
    }
  }

  // Membuat satu baris repeater: input teks/warna/gambar + tombol hapus baris.
  function buildRepeaterRow(containerId, specs) {
    const list = document.getElementById(containerId);
    if (!list) return null;

    const row = document.createElement('div');
    row.className = 'repeater-row grid grid-cols-12 gap-2 items-center p-2 rounded-lg border border-slate-200 bg-slate-50';

    const inputs = specs.map(function (s) {
      if (s.type === 'color') {
        return '<input type="color" class="' + s.cls + ' ' + s.span +
          ' h-9 w-full rounded-lg border border-slate-300 bg-white cursor-pointer" value="' + normalizeHex_(s.value) + '">';
      }
      if (s.type === 'image') {
        return [
          '<div class="' + s.span + ' flex items-center gap-1.5 min-w-0">',
          '  <input type="text" class="' + s.cls + ' flex-1 min-w-0 h-9 px-3 rounded-lg border border-slate-300" placeholder="' +
            escapeHtml(s.placeholder || '') + '" value="' + escapeHtml(s.value == null ? '' : s.value) + '">',
          '  <button type="button" title="Unggah gambar ke Drive"',
          '    class="rep-upload shrink-0 h-9 w-9 rounded-lg border border-brand-primary text-brand-primary hover:bg-blue-50 flex items-center justify-center">',
          '    <i data-lucide="upload" class="w-3.5 h-3.5"></i>',
          '  </button>',
          '  <img class="rep-preview hidden shrink-0 w-9 h-9 rounded-lg object-cover border border-slate-200" alt="">',
          '  <input type="file" class="rep-file hidden" accept="image/*">',
          '</div>'
        ].join('');
      }
      return '<input type="text" class="' + s.cls + ' ' + s.span +
        ' h-9 px-3 rounded-lg border border-slate-300" placeholder="' + escapeHtml(s.placeholder || '') + '" value="' +
        escapeHtml(s.value == null ? '' : s.value) + '">';
    }).join('');

    row.innerHTML = inputs + [
      '<button type="button" title="Hapus baris"',
      '  class="rep-del col-span-1 h-9 rounded-lg text-rose-500 hover:bg-rose-50 flex items-center justify-center">',
      '  <i data-lucide="x" class="w-4 h-4"></i>',
      '</button>'
    ].join('');

    wireRepeaterRow(row);

    list.appendChild(row);
    if (window.lucide) lucide.createIcons();
    return row;
  }

    clearRepeater('drawer-colors-list');

  const VIMEO_PATTERN = /vimeo\.com\/(?:video\/)?(\d+)/;

  // Mengambil ID YouTube dari berbagai bentuk tautan.
  function extractYouTubeId_(url) {
    const s = String(url || '');
    const patterns = [
      /youtu\.be\/([-\w]{6,})/,
      /[?&]v=([-\w]{6,})/,
      /youtube\.com\/embed\/([-\w]{6,})/,
      /youtube\.com\/shorts\/([-\w]{6,})/,
      /youtube\.com\/live\/([-\w]{6,})/
    ];
    for (let i = 0; i < patterns.length; i++) {
      const m = s.match(patterns[i]);
      if (m) return m[1];
    }
    return '';
  }

  // Menentukan jenis & URL putar video dari konfigurasi tersimpan.
  function resolveVideoSource_(config) {
    const c = config || {};
    if (String(c.video_enabled || 'true') === 'false') return { kind: 'none', url: '' };

    const source = String(c.video_source || 'youtube');
    if (source === 'upload') {
      const u = String(c.video_direct_url || '').trim();
      return u ? { kind: 'file', url: u } : { kind: 'none', url: '' };
    }
    if (source === 'direct') {
      const u = String(c.video_url || '').trim();
      return u ? { kind: 'file', url: u } : { kind: 'none', url: '' };
    }

    const link = String(c.video_url || '').trim();
    if (!link) return { kind: 'none', url: '' };

    const yt = extractYouTubeId_(link);
    if (yt) {
      return {
        kind: 'youtube',
        url: 'https://www.youtube.com/embed/' + yt +
          '?autoplay=1&mute=1&loop=1&playlist=' + yt +
          '&controls=0&modestbranding=1&rel=0&playsinline=1&disablekb=1&fs=0&enablejsapi=1' +
          '&iv_load_policy=3&cc_load_policy=0&color=white'
      };
    }

    const vm = link.match(VIMEO_PATTERN);
    if (vm) {
      return {
        kind: 'vimeo',
        url: 'https://player.vimeo.com/video/' + vm[1] +
          '?autoplay=1&muted=1&loop=1&background=1&autopause=0'
      };
    }

    return { kind: 'file', url: link };
  }

  // Markup pemutar: iframe untuk YouTube/Vimeo, <video> untuk berkas.
  function buildVideoMarkup_(resolved, poster) {
    if (!resolved || resolved.kind === 'none') return '';

    if (resolved.kind === 'file') {
      const posterAttr = poster ? ' poster="' + escapeHtml(poster) + '"' : '';
      return '<div class="volvo-video-shell"><video autoplay muted loop playsinline preload="metadata"' +
        posterAttr + '><source src="' + escapeHtml(resolved.url) + '" type="video/mp4">' +
        'Browser Anda tidak mendukung pemutar video.</video></div>';
    }

    // Pembungkus .volvo-video-shell memangkas tepi iframe sehingga judul, logo,
    // dan tombol "Watch on YouTube" tidak terlihat oleh pengunjung.
    return '<div class="volvo-video-shell">' +
      '<iframe src="' + escapeHtml(resolved.url) + '" title="Volvo Cinematic Video"' +
      ' frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>' +
      '</div>';
  }

  // Memaksa pemutaran otomatis. Atribut "muted" pada markup saja tidak cukup di
  // Chrome/Safari: properti .muted wajib diset sebelum play() dipanggil.
  function forceAutoplay_(container) {
    if (!container || typeof container.querySelector !== 'function') return;

    const video = container.querySelector('video');
    if (video) {
      video.muted = true;
      video.defaultMuted = true;
      video.setAttribute('muted', '');
      video.setAttribute('playsinline', '');

      const attempt = function () {
        const p = video.play();
        if (p && typeof p.catch === 'function') p.catch(function () { /* menunggu interaksi pengguna */ });
      };
      attempt();
      if (video.readyState < 2) video.addEventListener('loadeddata', attempt, { once: true });
      return;
    }

    const frame = container.querySelector('iframe');
    if (frame) nudgeYouTube_(frame);
  }

  // Embed YouTube baru mau autoplay bila diperintah lewat postMessage
  // (karena itu URL embed memakai enablejsapi=1).
  function nudgeYouTube_(frame) {
    if (!frame || !frame.contentWindow) return;

    const send = function (func) {
      try {
        frame.contentWindow.postMessage(
          JSON.stringify({ event: 'command', func: func, args: [] }), '*');
      } catch (e) { /* lintas-origin: abaikan */ }
    };
    const kick = function () { send('mute'); send('playVideo'); };

    if (typeof frame.addEventListener === 'function') frame.addEventListener('load', kick);
    [500, 1500, 3000].forEach(function (delay) { setTimeout(kick, delay); });
  }

      if (!Object.prototype.hasOwnProperty.call(c, key)) return;
      const value = c[key] == null ? '' : String(c[key]);
      el.textContent = value;
      // Elemen yang sengaja dikosongkan admin ikut disembunyikan.
      if (value) el.classList.remove('hidden');
      else el.classList.add('hidden');
    });

    document.querySelectorAll('[data-site-img]').forEach(function (el) {
      const key = el.getAttribute('data-site-img');
      if (!Object.prototype.hasOwnProperty.call(c, key)) return;
      const url = String(c[key] || '').trim();
      if (url) setImgSrc_(el, url);
      else el.src = IMG_PLACEHOLDER;
    });

    document.querySelectorAll('[data-site-icon]').forEach(function (el) {
      const key = el.getAttribute('data-site-icon');
      const icon = String(c[key] || '').trim();
      if (icon && el.getAttribute('data-lucide') !== icon) el.setAttribute('data-lucide', icon);
    });

    applyBrandLogo_(c);
    applySiteVideo(c);
    applySiteVisibility_(c);
    renderSiteNav(c);

    section.classList.toggle('hidden', resolved.kind === 'none');

  // Admin memilih berkas MP4 → batasi ukuran lalu unggah ke Drive.
  function handleVideoUpload(input) {
    const file = input && input.files ? input.files[0] : null;
    if (!file) return;

    const status = document.getElementById('video-upload-status');

    if (file.size > SITE_MEDIA_MAX_BYTES) {
      showToast('Ukuran video maksimal 15 MB. Untuk video lebih besar gunakan tautan YouTube.', 'error');
      input.value = '';
      if (status) status.textContent = 'Berkas terlalu besar';
      return;
    }

    if (status) status.textContent = 'Mengunggah ' + file.name + '...';
    setVideoStatus('Mengunggah video ke Drive...', 'ok');

    readFileAsDataUrl(file, function (dataUrl) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.url) {
            SITE_PENDING_VIDEO = res.url;
            if (status) status.textContent = file.name + ' siap disimpan';
            setVideoStatus('Video tersimpan di ' + (res.folder || 'Drive') + '. Klik "Simpan Video" untuk menerapkan.', 'ok');
            const sel = document.getElementById('video-source');
            if (sel) sel.value = 'upload';
            onVideoSourceChange();
            updateVideoPreview();
            if (res.shared === 'private') {
              showToast('Video terunggah, tetapi tautan Drive belum publik. Set "Anyone with the link" agar video dapat diputar pengunjung.', 'error');
            }
          } else {
            if (status) status.textContent = 'Gagal mengunggah';
            setVideoStatus('Gagal mengunggah video: ' + ((res && res.message) || 'tidak diketahui'), 'error');
          }
        })
        .withFailureHandler(function (err) {
          if (status) status.textContent = 'Gagal mengunggah';
          setVideoStatus('Gagal mengunggah video: ' + err.message, 'error');
        })
        .uploadSiteMedia(ADMIN_TOKEN, dataUrl, 'landing_' + Date.now() + '.mp4', file.type || 'video/mp4');
    }, function () {
      if (status) status.textContent = 'Gagal membaca berkas';
      setVideoStatus('Gagal membaca berkas video.', 'error');
    });
  }

  // Simpan khusus pengaturan video.
  function saveLandingVideo() {
    saveSiteKeys(collectVideoValues());
  }

  // --- Logo / gambar nama brand ---
  // Bila logo diisi, teks nama brand di navigasi otomatis disembunyikan.
  function applyBrandLogo_(config) {
    const c = config || {};
    const logo = document.getElementById('brand-logo');
    const text = document.getElementById('brand-name-text');
    if (!logo) return;

    const url = String(c.brand_logo_url || '').trim();
    if (!url) {
      logo.classList.add('hidden');
      if (text && String(c.brand_name || '').trim()) text.classList.remove('hidden');
      return;
    }

    const height = BRAND_LOGO_HEIGHTS.indexOf(String(c.brand_logo_height || '')) >= 0
      ? String(c.brand_logo_height)
      : BRAND_LOGO_HEIGHTS[1];

    logo.className = 'w-auto max-w-[200px] object-contain ' + height;
    setImgSrc_(logo, url);
    if (text) text.classList.add('hidden');
  }

  function collectLogoValues() {
    const val = function (id) {
      const el = document.getElementById(id);
      return el ? String(el.value || '') : '';
    };
    return {
      brand_logo_url: val('brand-logo-url'),
      brand_logo_height: val('brand-logo-height') || BRAND_LOGO_HEIGHTS[1]
    };
  }

  function setBrandLogoStatus(text, type) {
    const el = document.getElementById('brand-logo-status');
    if (!el) return;
    if (!text) {
      el.classList.add('hidden');
      el.textContent = '';
      return;
    }
    el.classList.remove('hidden');
    el.className = 'text-xs rounded-lg px-3 py-2 ' +
      (type === 'error' ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-brand-emerald');
    el.textContent = text;
  }

  function updateBrandLogoPreview() {
    const img = document.getElementById('brand-logo-preview');
    const empty = document.getElementById('brand-logo-empty');
    if (!img) return;

    const values = collectLogoValues();
    const url = values.brand_logo_url.trim();
    const height = BRAND_LOGO_HEIGHTS.indexOf(values.brand_logo_height) >= 0
      ? values.brand_logo_height
      : BRAND_LOGO_HEIGHTS[1];

    img.className = 'w-auto max-w-full object-contain ' + height;

    if (url) {
      setImgSrc_(img, url);
      if (empty) empty.classList.add('hidden');
    } else {
      img.classList.add('hidden');
      if (empty) empty.classList.remove('hidden');
    }
  }

  function syncLogoPanel(config) {
    const c = config || {};
    const setVal = function (id, value) {
      const el = document.getElementById(id);
      if (el) el.value = value == null ? '' : String(value);
    };
    setVal('brand-logo-url', c.brand_logo_url);
    setVal('brand-logo-height', c.brand_logo_height || BRAND_LOGO_HEIGHTS[1]);

    const status = document.getElementById('brand-logo-upload-status');
    if (status) status.textContent = c.brand_logo_url ? 'Logo tersimpan' : 'Belum ada berkas dipilih';

    updateBrandLogoPreview();
  }

  // Admin memilih berkas logo → validasi jenis & ukuran, lalu unggah ke Drive.
  function handleBrandLogoUpload(input) {
    const file = input && input.files ? input.files[0] : null;
    if (!file) return;

    const status = document.getElementById('brand-logo-upload-status');
    const mime = String(file.type || '');

    if (mime.indexOf('image/') !== 0 || mime.indexOf('svg') >= 0) {
      showToast('Format logo harus PNG, JPG, atau WebP.', 'error');
      input.value = '';
      if (status) status.textContent = 'Format tidak didukung';
      return;
    }

    if (file.size > BRAND_LOGO_MAX_BYTES) {
      showToast('Ukuran logo maksimal 2 MB.', 'error');
      input.value = '';
      if (status) status.textContent = 'Berkas terlalu besar';
      return;
    }

    if (status) status.textContent = 'Mengunggah ' + file.name + '...';
    setBrandLogoStatus('Mengunggah logo ke Drive...', 'ok');

    const ext = (String(file.name).match(/\.[a-z0-9]+$/i) || ['.png'])[0];

    readFileAsDataUrl(file, function (dataUrl) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.url) {
            const field = document.getElementById('brand-logo-url');
            if (field) field.value = res.url;
            if (status) status.textContent = file.name + ' siap disimpan';
            setBrandLogoStatus('Logo tersimpan di ' + (res.folder || 'Drive') + '. Klik "Simpan Logo" untuk menerapkan.', 'ok');
            updateBrandLogoPreview();
            if (res.shared === 'private') {
              showToast('Logo terunggah, tetapi tautan Drive belum publik. Set "Anyone with the link" agar logo tampil.', 'error');
            }
          } else {
            if (status) status.textContent = 'Gagal mengunggah';
            setBrandLogoStatus('Gagal mengunggah logo: ' + ((res && res.message) || 'tidak diketahui'), 'error');
          }
        })
        .withFailureHandler(function (err) {
          if (status) status.textContent = 'Gagal mengunggah';
          setBrandLogoStatus('Gagal mengunggah logo: ' + err.message, 'error');
        })
        .uploadSiteMedia(ADMIN_TOKEN, dataUrl, 'brand_logo_' + Date.now() + ext, mime || 'image/png');
    }, function () {
      if (status) status.textContent = 'Gagal membaca berkas';
      setBrandLogoStatus('Gagal membaca berkas logo.', 'error');
    });
  }

  function saveBrandLogo() {
    saveSiteKeys(collectLogoValues());
  }

  // Menghapus logo dari formulir; perlu klik "Simpan Logo" untuk menerapkan.
  function clearBrandLogo() {
    const field = document.getElementById('brand-logo-url');
    if (field) field.value = '';
    const status = document.getElementById('brand-logo-upload-status');
    if (status) status.textContent = 'Belum ada berkas dipilih';
    setBrandLogoStatus('Logo dikosongkan. Klik "Simpan Logo" untuk menerapkan.', 'ok');
    updateBrandLogoPreview();
  }

  // Simpan seluruh konten teks (termasuk pengaturan video).
  function handleSaveSiteConfig() {
    const payload = collectSiteConfigValues();
    const video = collectVideoValues();
    Object.keys(video).forEach(function (k) { payload[k] = video[k]; });
    const logo = collectLogoValues();
    Object.keys(logo).forEach(function (k) { payload[k] = logo[k]; });
    const nav = collectNavValues();
    Object.keys(nav).forEach(function (k) { payload[k] = nav[k]; });
    payload.nav_items = JSON.stringify(collectNavItems());
    saveSiteKeys(payload);
  }

  function saveSiteKeys(payload) {
    if (!ADMIN_TOKEN) {
      showToast('Sesi admin berakhir. Silakan login ulang.', 'error');
      return;
    }

    const btn = document.getElementById('btn-save-site');
    const label = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) { btn.disabled = false; btn.textContent = label || 'Simpan Konten'; }
        if (res && res.success) {
          showToast(res.message || 'Konten landing page berhasil disimpan.', 'success');
          setVideoStatus(res.message || 'Konten berhasil disimpan.', 'ok');
          loadSiteConfig();
        } else {
          const msg = (res && res.message) ? res.message : 'Gagal menyimpan konten.';
          showToast(msg, 'error');
          setVideoStatus(msg, 'error');
        }
      })
      .withFailureHandler(function (err) {
        if (btn) { btn.disabled = false; btn.textContent = label || 'Simpan Konten'; }
        showToast('Gagal menyimpan: ' + err.message, 'error');
        setVideoStatus('Gagal menyimpan: ' + err.message, 'error');
      })
      .saveSiteConfig(ADMIN_TOKEN, payload);
  }


  // ==========================================
  // VISIBILITAS NAVIGASI ATAS & SESI ADMIN
  // ==========================================
  let VIS_PICKER_COLLAPSED = false;
  const SITE_NAV_KEYS = ['nav_enabled', 'announce_enabled', 'nav_items'];
  // Pintu masuk login selalu terlihat; hanya pintu masuk panel yang dibatasi sesi.
  const ADMIN_LOGIN_IDS = ['admin-entry-nav', 'admin-entry-footer'];
  const ADMIN_ONLY_IDS = ['admin-entry-desk', 'admin-entry-footer-link'];
  const ADMIN_LABEL_PAIRS = [
    ['admin-label-in', 'admin-label-out'],
    ['admin-label-in-footer', 'admin-label-out-footer']
  ];

  // Admin bisa menyembunyikan strip pengumuman dan/atau navigasi utama.
  function applySiteVisibility_(config) {
    const c = config || {};

    const announce = document.getElementById('site-announce-strip');
    if (announce) announce.classList.toggle('hidden', String(c.announce_enabled || 'true') === 'false');

    const nav = document.getElementById('site-main-nav');
    if (nav) nav.classList.toggle('hidden', String(c.nav_enabled || 'true') === 'false');
  }

  // Pintu login TIDAK pernah disembunyikan (kalau disembunyikan, admin tidak bisa
  // masuk sama sekali) - hanya labelnya yang menyesuaikan status sesi.
  // Pintu panel admin baru tampil setelah sesi terbukti sah.
  function setAdminEntryVisible(visible) {
    ADMIN_LOGIN_IDS.forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove('hidden');
    });

    ADMIN_ONLY_IDS.forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden', !visible);
    });

    ADMIN_LABEL_PAIRS.forEach(function (pair) {
      const labelIn = document.getElementById(pair[0]);
      const labelOut = document.getElementById(pair[1]);
      if (labelIn) labelIn.classList.toggle('hidden', !visible);
      if (labelOut) labelOut.classList.toggle('hidden', visible);
    });
  }

  function applyAdminEntryVisibility() {
    setAdminEntryVisible(!!ADMIN_TOKEN);
  }

  // Memastikan token tersimpan masih sah sebelum menampilkan tombol admin.
  function verifyStoredAdminSession(token) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success && res.valid) {
          ADMIN_TOKEN = token;
          setAdminEntryVisible(true);
        } else {
          clearAdminSession();
        }
      })
      .withFailureHandler(function () {
        clearAdminSession();
      })
      .verifyAdminToken(token);
  }

  // Membersihkan sesi di sisi klien tanpa memanggil backend.
  function clearAdminSession() {
    ADMIN_TOKEN = null;
    try { sessionStorage.removeItem('VOLVO_ADMIN_TOKEN'); } catch (e) { /* abaikan */ }
    setAdminEntryVisible(false);
  }

  // Keluar dari Portal CRM: akhiri sesi di server & klien, lalu kembali ke showroom.
  function handleAdminLogout() {
    const token = ADMIN_TOKEN;

    const finish = function (message) {
      clearAdminSession();
      exitAdminView();
      showToast(message || 'Anda telah keluar dari Portal CRM.', 'success');
    };

    if (!token) {
      finish('Anda belum masuk sebagai admin.');
      return;
    }

    google.script.run
      .withSuccessHandler(function (res) {
        finish((res && res.success) ? 'Berhasil keluar. Sesi admin telah diakhiri.' : 'Keluar dari perangkat ini.');
      })
      .withFailureHandler(function () {
        // Sesi klien tetap dibersihkan walau server tidak merespons.
        finish('Keluar dari perangkat ini. Sesi server mungkin masih aktif.');
      })
      .logoutAdmin(token);
  }

  // --- Ringkas / lebarkan pemilih unit pada Studio Visualizer ---
  function toggleVisCarPicker() {
    VIS_PICKER_COLLAPSED = !VIS_PICKER_COLLAPSED;
    try {
      localStorage.setItem('VOLVO_VIS_PICKER_COLLAPSED', VIS_PICKER_COLLAPSED ? '1' : '0');
    } catch (e) { /* abaikan */ }
    applyVisPickerCollapsedState((CARS_DATA || []).length);
  }

  // --- Panel admin: on/off navigasi atas ---
  function collectNavValues() {
    const val = function (id) {
      const el = document.getElementById(id);
      return el ? String(el.value || '') : '';
    };
    return {
      nav_enabled: val('nav-enabled') || 'true',
      announce_enabled: val('announce-enabled') || 'true'
    };
  }

  function syncNavPanel(config) {
    const c = config || {};
    const setVal = function (id, value) {
      const el = document.getElementById(id);
      if (el) el.value = value == null ? '' : String(value);
    };
    setVal('nav-enabled', c.nav_enabled === 'false' ? 'false' : 'true');
    setVal('announce-enabled', c.announce_enabled === 'false' ? 'false' : 'true');
    updateNavPreview();
  }

  // Keterangan kecil di panel admin tentang bagian yang sedang disembunyikan.
  function updateNavPreview() {
    const note = document.getElementById('nav-visibility-note');
    if (!note) return;

    const nav = collectNavValues();
    const hidden = [];
    if (nav.announce_enabled === 'false') hidden.push('strip pengumuman');
    if (nav.nav_enabled === 'false') hidden.push('navigasi utama');

    note.textContent = hidden.length
      ? 'Disembunyikan dari pengunjung: ' + hidden.join(' dan ') + '. Klik "Simpan Tampilan" untuk menerapkan.'
      : 'Semua bagian navigasi atas sedang tampil.';
  }

  function saveNavVisibility() {
    saveSiteKeys(collectNavValues());
  }

  // ==========================================
  // MENU NAVIGASI ATAS DINAMIS
  // Daftar menu disimpan sebagai JSON di CONFIG_SITE (kunci nav_items),
  // sehingga admin bisa menambah, mengurangi, dan menyembunyikan menu.
  // ==========================================
  const NAV_ACTIONS = [
    ['lineup', 'Gulir ke Lineup'],
    ['visualizer', 'Buka Studio Visualizer'],
    ['booking', 'Buka Booking Test Drive'],
    ['admin', 'Buka Portal Admin'],
    ['link', 'Buka tautan baru']
  ];
  const NAV_ACTION_VALUES = NAV_ACTIONS.map(function (a) { return a[0]; });

  // Membaca daftar menu tersimpan dengan aman dan menormalkan setiap bidang.
  function parseNavItems_(value) {
    return parseJsonSafe_(value).filter(function (it) {
      return it && typeof it === 'object';
    }).map(function (it) {
      const action = NAV_ACTION_VALUES.indexOf(String(it.action)) >= 0 ? String(it.action) : 'lineup';
      return {
        label: String(it.label == null ? '' : it.label),
        action: action,
        url: String(it.url == null ? '' : it.url),
        visible: String(it.visible == null ? 'true' : it.visible) === 'false' ? 'false' : 'true'
      };
    });
  }

  // Membangun satu tautan navigasi sesuai aksinya.
  function buildNavItemMarkup_(item) {
    const label = escapeHtml(item.label);
    const cls = 'hover:text-brand-primary transition-colors';

    if (item.action === 'lineup') {
      return '<a href="#lineup" class="' + cls + '">' + label + '</a>';
    }
    if (item.action === 'visualizer') {
      const target = item.url || (CARS_DATA && CARS_DATA.length ? CARS_DATA[0].id : '');
      return '<button type="button" onclick="openVisualizerById(\'' + escapeHtml(target) + '\')" class="' + cls + '">' +
        label + '</button>';
    }
    if (item.action === 'booking') {
      return '<button type="button" onclick="openBookingModal()" class="' + cls + '">' + label + '</button>';
    }
    if (item.action === 'admin') {
      return '<button type="button" onclick="openAdminModal()" class="' + cls + '">' + label + '</button>';
    }
    if (!item.url) return '';
    return '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener" class="' + cls + '">' + label + '</a>';
  }

  // Menampilkan menu navigasi atas dari konfigurasi tersimpan.
  function renderSiteNav(config) {
    const holder = document.getElementById('site-nav-menu');
    if (!holder) return;

    const items = parseNavItems_((config || SITE_CONFIG || {}).nav_items);
    holder.innerHTML = items.filter(function (it) {
      return it.visible !== 'false' && String(it.label).trim();
    }).map(buildNavItemMarkup_).join('');
  }

  // --- Panel admin: kelola daftar menu ---
  function buildNavItemRow_(item) {
    const list = document.getElementById('nav-items-list');
    if (!list) return null;

    const data = item || { label: '', action: 'lineup', url: '', visible: 'true' };
    const row = document.createElement('div');
    row.className = 'nav-item-row grid grid-cols-12 gap-2 items-center p-2 rounded-lg border border-slate-200 bg-slate-50';

    const options = NAV_ACTIONS.map(function (a) {
      return '<option value="' + a[0] + '"' + (String(data.action) === a[0] ? ' selected' : '') + '>' +
        a[1] + '</option>';
    }).join('');

    row.innerHTML = [
      '<input type="text" class="nav-label col-span-12 sm:col-span-4 h-9 px-3 rounded-lg border border-slate-300 text-xs" placeholder="Label menu" value="' + escapeHtml(data.label) + '">',
      '<select class="nav-action col-span-6 sm:col-span-3 h-9 px-2 rounded-lg border border-slate-300 text-xs">' + options + '</select>',
      '<input type="text" class="nav-url col-span-6 sm:col-span-3 h-9 px-3 rounded-lg border border-slate-300 text-xs" placeholder="ID unit atau URL" value="' + escapeHtml(data.url) + '">',
      '<select class="nav-visible col-span-9 sm:col-span-1 h-9 px-1 rounded-lg border border-slate-300 text-xs">' +
      '<option value="true"' + (data.visible !== 'false' ? ' selected' : '') + '>Ya</option>' +
      '<option value="false"' + (data.visible === 'false' ? ' selected' : '') + '>Tidak</option>' +
      '</select>',
      '<button type="button" class="nav-del col-span-3 sm:col-span-1 h-9 rounded-lg text-rose-500 hover:bg-rose-50 flex items-center justify-center" title="Hapus menu">',
      '<i data-lucide="x" class="w-4 h-4"></i>',
      '</button>'
    ].join('');

    row.querySelector('.nav-del').onclick = function () { removeNavItemRow(row); };
    list.appendChild(row);
    if (window.lucide) lucide.createIcons();
    return row;
  }

  function addNavItemRow(item) {
    return buildNavItemRow_(item);
  }

  function removeNavItemRow(row) {
    if (row && row.parentNode) row.parentNode.removeChild(row);
  }

  function clearNavItemRows() {
    const list = document.getElementById('nav-items-list');
    if (list) list.innerHTML = '';
  }

  // Mengumpulkan menu dari formulir; baris tanpa label diabaikan.
  function collectNavItems() {
    const list = document.getElementById('nav-items-list');
    if (!list) return [];

    const rows = Array.prototype.slice.call(list.querySelectorAll('.nav-item-row'));
    const out = [];

    rows.forEach(function (row) {
      const val = function (cls) {
        const el = row.querySelector('.' + cls);
        return el ? String(el.value || '') : '';
      };
      const label = val('nav-label').trim();
      if (!label) return;
      out.push({
        label: label,
        action: val('nav-action') || 'lineup',
        url: val('nav-url').trim(),
        visible: val('nav-visible') || 'true'
      });
    });

    return out;
  }

  // Menampilkan daftar menu tersimpan pada panel admin.
  function fillNavItemRows(config) {
    clearNavItemRows();
    const items = parseNavItems_((config || {}).nav_items);
    if (!items.length) {
      buildNavItemRow_();
      return;
    }
    items.forEach(function (it) { buildNavItemRow_(it); });
  }

  function setNavItemStatus(text, type) {
    const el = document.getElementById('nav-item-status');
    if (!el) return;
    if (!text) {
      el.classList.add('hidden');
      el.textContent = '';
      return;
    }
    el.classList.remove('hidden');
    el.className = 'text-xs rounded-lg px-3 py-2 ' +
      (type === 'error' ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-brand-emerald');
    el.textContent = text;
  }

  function saveNavItems() {
    const items = collectNavItems();
    if (!items.length) {
      showToast('Minimal satu menu harus punya label.', 'error');
      return;
    }
    saveSiteKeys({ nav_items: JSON.stringify(items) });
  }
  function skeletonSite_() {
    const holder = document.getElementById('site-config-form');
    if (holder) holder.innerHTML = skeletonLines_(6);
  }
</script>
